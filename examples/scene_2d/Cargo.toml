[package]
name = "scene_2d"
description = "Loads a scene file and instances it many times: nodes, transforms and sprite nodes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
star_engine.workspace = true
env_logger.workspace = true
log.workspace = true

[lints]
workspace = true

[lib]
# A shared library for Android, which loads games as one; an rlib for the
# desktop `main`.
crate-type = ["cdylib", "rlib"]

# Read by `cargo apk2` to build the Android package, with the scene and its
# images inside.
[package.metadata.android]
package = "dev.projectstar.scene_2d"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
assets = "assets"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Scene 2D"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

# The NativeActivity of the system runs the game's `android_main`; the
# launcher opens it.
[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "scene_2d"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
