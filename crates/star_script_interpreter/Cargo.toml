[package]
name = "star_script_interpreter"
description = "Interpreter of StarScript: runs programs without building them, for Play in the editor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
star_script.workspace = true
star_script_runtime.workspace = true

# Only the window test joins the interpreter with the engine (decision 70):
# the interpreter itself stays a tool without it.
[dev-dependencies]
star_engine.workspace = true
star_script_engine.workspace = true

# Opens a window, which needs the main thread: run it with
# `cargo test -p star_script_interpreter --test window -- --ignored`.
[[test]]
name = "window"
harness = false

# The node game with its scenes, in a window too:
# `cargo test -p star_script_interpreter --test window_scene -- --ignored`.
[[test]]
name = "window_scene"
harness = false

[lints]
workspace = true
