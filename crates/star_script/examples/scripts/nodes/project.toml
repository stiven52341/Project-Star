# ProjectStar project file.
[project]
name = "Nodes demo"
engine_version = "0.1.0"
dimension = "2d"
platforms = ["linux", "windows", "macos"]

[input.actions]
left = ["ArrowLeft", "A", "GamepadDPadLeft", "GamepadLeftStickLeft"]
right = ["ArrowRight", "D", "GamepadDPadRight", "GamepadLeftStickRight"]
up = ["ArrowUp", "W", "GamepadDPadUp", "GamepadLeftStickUp"]
down = ["ArrowDown", "S", "GamepadDPadDown", "GamepadLeftStickDown"]
# Held while the mouse button or a finger is down: the ship flies towards
# where it points.
follow = ["MouseLeft", "Touch"]
quit = ["Escape", "GamepadStart"]
